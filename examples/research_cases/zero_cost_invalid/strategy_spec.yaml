schema_version: "0.1"
strategy_id: "zero_cost_invalid"
name: "Zero-Cost Model (Invalid)"

research:
  hypothesis: >
    This spec intentionally uses zero fee and zero slippage to demonstrate
    a cost model issue that should be caught by validation.
  rationale: >
    Golden case for spec validation — should FAIL with cost_model_missing error.

market:
  asset_class: "equity"
  region: "us"
  currency: "USD"

universe:
  type: "static"
  symbols: ["SPY"]

data:
  price_adjustment: "adjusted"

signal:
  signal_time: "close_t"
  indicators:
    momentum_20:
      type: "NdayReturn"
      params:
        column: "close"
        period: 20

execution:
  trade_time: "next_open"
  fill_price_mode: "next_open"

cost:
  fee_rate: 0.0
  slippage_rate: 0.0

benchmark:
  symbols: ["SPY"]

validation:
  test_period: ["2022-01-01", "2025-12-31"]
