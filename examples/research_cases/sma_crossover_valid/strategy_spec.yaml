schema_version: "0.1"
strategy_id: "sma_crossover_valid"
name: "SMA Crossover Weekly"

research:
  hypothesis: >
    Short-term SMA crossing above long-term SMA indicates upward momentum,
    while the reverse crossover signals exit.
  rationale: >
    Moving average crossovers capture trend changes. Using next_open execution
    avoids same-bar look-ahead bias.
  author: "open-xquant"
  created_at: "2026-06-16"

market:
  asset_class: "equity"
  region: "us"
  currency: "USD"
  calendar: "XNYS"

universe:
  type: "static"
  symbols: ["SPY"]

data:
  provider: "local"
  price_adjustment: "adjusted"
  required_columns: ["open", "high", "low", "close", "volume"]

signal:
  signal_time: "close_t"
  indicators:
    sma_fast:
      type: "SMA"
      params:
        column: "close"
        period: 10
    sma_slow:
      type: "SMA"
      params:
        column: "close"
        period: 50
  rules:
    golden_cross:
      type: "Crossover"
      params:
        fast: "sma_fast"
        slow: "sma_slow"

portfolio:
  type: "EqualWeight"
  params: {}

execution:
  rebalance:
    frequency: "weekly"
    interval_days: 5
  trade_time: "next_open"
  fill_price_mode: "next_open"
  lot_size: 1
  initial_cash: 100000

cost:
  fee_rate: 0.001
  fee_min: 0
  slippage_rate: 0.001

benchmark:
  symbols: ["SPY"]

validation:
  train_period: ["2018-01-01", "2021-12-31"]
  test_period: ["2022-01-01", "2025-12-31"]
  required_oos: true

robustness:
  cost_multiplier: [1.0, 2.0]
  parameter_perturbation:
    sma_fast.period: [5, 10, 20]
    sma_slow.period: [30, 50, 80]
  regime_analysis: true

decision_policy:
  reject_if:
    fatal_audit_findings: true
    oos_sharpe_lt: 0.3
  promote_if:
    oos_sharpe_gte: 1.0
    max_drawdown_gte: -0.20
