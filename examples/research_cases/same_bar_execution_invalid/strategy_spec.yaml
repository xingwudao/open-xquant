schema_version: "0.1"
strategy_id: "same_bar_execution_invalid"
name: "Same-Bar Execution (Invalid)"

research:
  hypothesis: >
    This spec intentionally uses close_t trade_time and close fill_price_mode
    to demonstrate a look-ahead bias that should be caught by validation.
  rationale: >
    Golden case for spec validation — should FAIL with execution_lag error.

market:
  asset_class: "equity"
  region: "us"
  currency: "USD"

universe:
  type: "static"
  symbols: ["SPY"]

data:
  price_adjustment: "adjusted"

signal:
  signal_time: "close_t"
  indicators:
    momentum_20:
      type: "NdayReturn"
      params:
        column: "close"
        period: 20

execution:
  trade_time: "close_t"
  fill_price_mode: "close"

cost:
  fee_rate: 0.001
  slippage_rate: 0.001

benchmark:
  symbols: ["SPY"]

validation:
  train_period: ["2018-01-01", "2021-12-31"]
  test_period: ["2022-01-01", "2025-12-31"]
  required_oos: true
